# ===============================
# Custom properties
# ===============================

server.cofiguration.resources=work

# ===============================
# Web
# ===============================

server.port=8888
server.error.path=/Error
server.error.include-exception=false
server.error.include-stacktrace=never

# ===============================
# Datasource
# ===============================

spring.datasource.url=jdbc:derby:work/database
spring.datasource.username=app
spring.datasource.password=secr3t
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.datasource.continue-on-error=false
spring.datasource.initialization-mode=never
spring.sql.init.mode=never

# ===============================
# JPA
# ===============================

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type=error
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.DerbyDialect
spring.jpa.hibernate.ddl-auto=none

# ===============================
# Mail
# ===============================

server.cofiguration.mail-host=localhost
server.cofiguration.mail-port=8025
server.cofiguration.mail-username=myuser
server.cofiguration.mail-password=mysecretpassword
server.cofiguration.mail-ssl-enable=false
server.cofiguration.mail-start-tls-enable=false
server.cofiguration.mail-from=test@storeapp.local


# ===============================
# Logging
# ===============================

debug=false
logging.level.es.storeapp=INFO
logging.level.org.springframework.web=ERROR
logging.level.org.thymeleaf=ERROR
logging.level.com.zaxxer.hikari.pool=ERROR
logging.file.name=./logs/server.log

# ===============================
# Management
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.shutdown.enabled=false
# Sesiones: SameSite y Secure deben revisarse segun TLS del despliegue
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

management.endpoint.health.show-details=never
server.error.include-message=never
server.forward-headers-strategy=none
